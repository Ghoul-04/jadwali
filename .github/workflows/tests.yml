name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test
      - name: Reminder dry run (sample recipients, no network)
        env:
          DRY_RUN: '1'
          RECIPIENTS: '[{"chat_id":0,"profile":"carrier","shift":"morning","heatTrack":"morning","labGroup":"unknown"},{"chat_id":0,"profile":"standard","shift":"morning"}]'
        run: node reminder/send.mjs
