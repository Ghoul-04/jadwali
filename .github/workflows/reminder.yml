name: Nightly reminder

on:
  schedule:
    # 18:07 UTC = 21:07 Baghdad (UTC+3, no DST), on Sat–Wed (the nights before workdays).
    # Minute 7 (not 0) avoids GitHub's top-of-the-hour congestion.
    - cron: '7 18 * * 6,0,1,2,3'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print the messages instead of sending them'
        type: boolean
        default: false

permissions:
  contents: read
  actions: write   # only used by the keepalive step below

concurrency:
  group: reminder
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Send tomorrow's schedule
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          RECIPIENTS: ${{ secrets.RECIPIENTS }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: node reminder/send.mjs

      # GitHub disables scheduled workflows after 60 days without repository activity.
      # Re-enabling the workflow through the API resets that timer, with no commits needed.
      - name: Keepalive
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/reminder.yml/enable" --silent && echo "keepalive ok"
